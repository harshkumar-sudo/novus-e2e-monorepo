services:
  - type: web
    name: fieldnotes-api-hk
    runtime: node
    plan: free
    buildCommand: npm install && npm run build --workspace @fieldnotes/api
    startCommand: npm run start --workspace @fieldnotes/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: fieldnotes-web-hk
    runtime: static
    buildCommand: npm install && npm exec --workspace @fieldnotes/web -- vite build
    staticPublishPath: apps/web/dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://fieldnotes-api-hk.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: fieldnotes-admin-hk
    runtime: static
    buildCommand: npm install && npm exec --workspace @fieldnotes/admin -- vite build
    staticPublishPath: apps/admin/dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://fieldnotes-api-hk.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
